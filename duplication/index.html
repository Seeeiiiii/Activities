<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>7 Wonders of the World</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dark text-white min-vh-100 overflow-x-hidden">
  <img id="bg" class="position-fixed top-0 start-0 w-100 h-100 object-fit-cover" style="opacity: 0" alt="">
  <div class="position-fixed top-0 start-0 w-100 h-100 bg-black bg-opacity-50 pe-none"></div>

  <div class="container-fluid position-relative">
    <div class="row">
      <div class="col-12 col-xl-7 position-relative p-3 p-xl-5">
        <h1 id="title" class="display-3 fw-bold mb-1">7 Wonders of the World</h1>
        <p id="location" class="h5 mt-2">Pick a wonder<span class="d-none d-xl-inline"> on the right</span> to begin.</p>
        <div id="cards"></div>
      </div>
      <div id="sidebar"
        class="col-12 col-xl-5 order-first order-xl-last py-4"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>

  <script>
    const wonders = [
      {
        name: "Great Wall of China",
        location: "Northern China",
        bg: "images/greatwall-bg.png",
        side: "images/greatwall-side.png",
        cards: [
          { top: "25%", left: "5%", text: "Widely estimated at ~5,500 miles (8,850 km), though a disputed study claims up to 13,170 miles (21,200 km)." },
          { top: "25%", left: "35%", text: "Began in the 7th century BCE and continued for two millennia." },
          { top: "45%", left: "5%", text: "Two parallel walls, dotted with watchtowers and barracks." },
          { top: "42%", left: "35%", text: "Largely failed as a physical defense against invasions; scholars note it served primarily as 'political propaganda.'" }
        ]
      },
      {
        name: "Chichén Itzá",
        location: "Yucatán Peninsula, Mexico",
        bg: "images/chichen-bg.png",
        side: "images/chichen-side.png",
        cards: [
          { top: "26%", left: "8%", text: "9th and 10th centuries CE" },
          { top: "25%", left: "38%", text: "Notable Monument: El Castillo (“The Castle”)" },
          {
            top: "40%", left: "8%", width: "510px", text: `
            <ul class="mb-0 ps-3 mt-1">
              <li>Height: 79 feet (24 meters)</li>
              <li>Has a total of 365 steps (one for each day of the solar year).</li>
              <li>Home to the largest tlachtli (sporting field) in the Americas.</li>
            </ul>`
          },
          { top: "58%", left: "23%", text: "Influenced by the Toltecs; known for ritual ball games." }
        ]
      },
      {
        name: "Colosseum",
        location: "Rome, Italy",
        bg: "images/colosseum-bg.png",
        side: "images/colosseum-side.png",
        cards: [
          { top: "25%", left: "8%", text: "First century CE (Ordered by Emperor Vespasian)" },
          { top: "25%", left: "38%", text: "Features a complex system of vaults." },
          { top: "41%", left: "8%", text: "Held up to 80,000 spectators." },
          { top: "40%", left: "38%", text: "Amphitheater measuring 620 by 513 feet (189 by 156 meters)." },
          {
            top: "58%", left: "8%", width: "510px", text: `
            <ul class="mb-0 ps-3 mt-1">
              <li>Hosted gladiator fights and battles between men and animals.</li>
              <li>Estimated that 500,000 people and countless animals died there.</li>
              <li>Capture of animals for games reportedly led to the extinction of certain species.</li>
            </ul>`
          }
        ]
      },
      {
        name: "Christ the Redeemer",
        location: "Atop Mount Corcovado, Rio de Janeiro, Brazil",
        bg: "images/christ-bg.png",
        side: "images/christ-side.png",
        cards: [
          { top: "25%", left: "8%", text: "Proposed after WWI to counter a perceived 'tide of godlessness.'" },
          { top: "25%", left: "38%", text: "Designed by Heitor da Silva Costa, Carlos Oswald, and Paul Landowski." },
          { top: "43%", left: "8%", text: "Began in 1926 and completed in 1931." },
          {
            top: "43%", left: "38%", text: `
            <ul class="mb-0 ps-3 mt-1">
              <li>Height: 98 feet (30 meters), excluding its 26-foot (8-meter) base.</li>
              <li>Span: Outstretched arms span 92 feet (28 meters).</li>
            </ul>`
          },
          {
            top: "58%", left: "8%", text: `
            <ul class="mb-0 ps-3 mt-1">
              <li>It is the largest Art Deco sculpture in the world.</li>
              <li>Frequently struck by lightning, which damaged Jesus's right thumb in 2014..</li>
            </ul>`
          },
          { top: "68%", left: "38%", text: "Made of reinforced concrete and covered in approximately six million tiles." }
        ]
      },
      {
        name: "Machu Picchu",
        location: "Near Cuzco, Peru (High in the Andes Mountains)",
        bg: "images/machu-bg.png",
        side: "images/machu-side.png",
        cards: [
          {
            top: "25%", left: "8%", text: `
            <ul class="mb-0 ps-3 mt-1">
              <li>Originally thought to be Vilcabamba (a secret Incan rebellion stronghold).</li>
              <li>Variously believed to be a home for the "Virgins of the Sun," a pilgrimage site, or a royal retreat.</li>
            </ul>`
          },
          { top: "35%", left: "38%", text: "Discovered in 1911 by Hiram Bingham" },
          { top: "57%", left: "8%", text: "In 2000, a crane used while filming a beer commercial fell and cracked one of its historic monuments." },
          {
            top: "50%", left: "38%", text: `
            <ul class="mb-0 ps-3 mt-1">
              <li>One of the few major pre-Columbian ruins found nearly intact.</li>
              <li>Features agricultural terraces, plazas, residential areas, and temples.</li>
            </ul>`
          },
        ]
      },
      {
        name: "Petra",
        location: "Remote valley in Jordan, nestled among sandstone mountains and cliffs.",
        bg: "images/petra-bg.png",
        side: "images/petra-side.png",
        cards: [
          { top: "25%", left: "8%", text: "Made capital by the Nabataeans (an Arab tribe), under whom it flourished into an important spice trade center." },
          { top: "25%", left: "38%", text: "Religious Lore: Purported to be one of the places where Moses struck a rock to produce water." },
          {
            top: "50%", left: "8%", text: `
            <ul class="mb-0 ps-3 mt-1">
              <li>Master carvers chiseled dwellings, temples, and tombs directly into sandstone that changed color with the sun.</li>
              <li>Constructed an advanced water system that sustained lush gardens and farming.</li>
            </ul>`
          },
          {
            top: "47%", left: "38%", text: `
            <ul class="mb-0 ps-3 mt-1">
              <li>Declined as trade routes shifted and suffered major damage from earthquakes in 363 CE and 551 CE, leading to its gradual abandonment.</li>
              <li>Rediscovered in 1912, though ignored by archaeologists until the late 20th century.</li>
            </ul>`
          }
        ]
      },
      {
        name: "Taj Mahal",
        location: "Agra, India",
        bg: "images/taj-bg.png",
        side: "images/taj-side.png",
        cards: [
          { top: "25%", left: "8%", text: "Architectural Style: Finest example of Mughal architecture." },
          { top: "25%", left: "38%", text: "Built By: Emperor Shah Jahān (reigned 1628-58) in honor of his wife Mumtāz Maḥal, who died in 1631 giving birth to their 14th child." },
          { top: "50%", left: "38%", text: "Took about 22 years and required 20,000 workers to complete." },
          {
            top: "43%", left: "8%", text: `
            <ul class="mb-0 ps-3 mt-1">
              <li>Features an immense garden with a central reflecting pool.</li>
              <li>Made of white marble inlaid with semiprecious stones in geometric and floral patterns.</li>
              <li>Has a majestic central dome surrounded by four smaller domes.</li>
            </ul>`
          }
        ]
      }
    ];

    for (let i = 0; i < wonders.length; i++) {
      const w = wonders[i];
      const bgImg = new Image();
      bgImg.src = w.bg;
      const sideImg = new Image();
      sideImg.src = w.side;
    }

    const bg = document.getElementById("bg");
    const title = document.getElementById("title");
    const place = document.getElementById("location");
    const cards = document.getElementById("cards");
    const sidebar = document.getElementById("sidebar");

    let sidebarHTML = '<div class="row g-0">';
    for (let i = 0; i < wonders.length; i++) {
      const w = wonders[i];
      sidebarHTML += `
        <div class="col-6 col-md-4 col-xl-12 d-flex justify-content-center justify-content-xl-end p-1 p-xl-0">
          <div class="side-img ratio w-100 h-auto mb-2 rounded shadow-sm overflow-hidden"
               style="--bs-aspect-ratio: 30%; max-width: min(300px, calc((100vh - 110px) / 2.1));" onclick="selectWonder(${i})">
            <img class="object-fit-cover" src="${w.side}" alt="${w.name}">
          </div>
        </div>
      `;
    }
    sidebarHTML += "</div>";
    sidebar.innerHTML = sidebarHTML;

    function selectWonder(i) {
      const w = wonders[i];

      bg.style.opacity = 0;
      setTimeout(() => {
        bg.src = w.bg;
        bg.style.opacity = 1;
      }, 150);

      title.textContent = w.name;
      place.textContent = "📍 " + w.location;

      let desktopHTML = "";
      let mobileHTML = "";
      for (let j = 0; j < w.cards.length; j++) {
        const c = w.cards[j];
        desktopHTML += `
          <div class="glass position-absolute p-3 rounded-3" style="top: ${c.top}; left: ${c.left}; ${c.width ? 'width: ' + c.width + ';' : ''}">${c.text}</div>
        `;
        mobileHTML += `
          <div class="col">
            <div class="glass d-inline-block w-auto mw-100 p-3 rounded-3">${c.text}</div>
          </div>
        `;
      }
      cards.innerHTML = `
        <div class="d-none d-xl-block">${desktopHTML}</div>
        <div class="row row-cols-1 row-cols-md-2 g-3 mt-1 d-xl-none">${mobileHTML}</div>
      `;

      const sideImgs = document.querySelectorAll(".side-img");
      for (let n = 0; n < sideImgs.length; n++) {
        sideImgs[n].classList.toggle("active", n === i);
        sideImgs[n].classList.toggle("dimmed", n !== i);
      }
    }
  </script>
</body>

</html>
