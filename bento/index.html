<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bento Layout</title>

      <div class="col-10">

        <div class="row">
          <div class="col-3">
            <div class="card row1"></div>
          </div>

          <div class="col-3">
            <div class="card row1"></div>
          </div>

          <div class="col-6">
            <div class="card row1"></div>
          </div>
        </div>

        <div class="row mt-3">

            <div class="card row2"></div>
          </div>

          <div class="col-6">
            <div class="card row2"></div>
          </div>

          <div class="col-4">
            <div class="card row2"></div>

        </div>

        <div class="row mt-3">
          <div class="col-3">
            <div class="card mb-2"style="height:126px"></div>
             <div class="card" style="height:126px"></div>

          <div class="col-3">
            <div class="card row3"></div>
          </div>

            <div class="card row3"></div>
          </div>

            <div class="card row3"></div>
          </div>
        </div>
      </div>

      <div class="col-2">
        <div class="card mb-3" style="height:387px"></div>

        <div class="card" style="height:387px"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
